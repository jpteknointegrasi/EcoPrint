<style>
/* Layout concept: a herbarium sheet. Wide ivory margins, photographs pinned like specimens,
   every product carries a specimen label (SKU, mode, material) set in mono. One dark forest band per page. */
:root{
  --paper:#F7F4EC; --paper-2:#EEE9DC; --card:#FBF9F4; --ink:#282B25; --ink-2:#5A5D52; --ink-3:#8A8B7E;
  --forest:#203024; --on-forest:#F1EDE2; --olive:#68734A; --bark:#805E43; --line:#DCD5C4; --line-2:#C9C0AA;
  --btn:#203024; --btn-ink:#F7F4EC; --chip:#E6E0CF;
  --ok:#476633; --ok-bg:#E3EAD6; --warn:#8E5F1C; --warn-bg:#F3E6CC; --bad:#9C3524; --bad-bg:#F3DAD3; --info:#3C5A6E; --info-bg:#DCE6EB;
  --f-display:"Fraunces", "Iowan Old Style", Georgia, serif;
  --f-body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --w:1240px; --r:3px; --gut:clamp(16px,4vw,40px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#141914; --paper-2:#1B221C; --card:#192019; --ink:#ECE7DA; --ink-2:#B9B5A7; --ink-3:#8C8C80;
  --forest:#0D130E; --on-forest:#ECE7DA; --olive:#A3AE7C; --bark:#C99E79; --line:#2C352D; --line-2:#3B463C;
  --btn:#C9D2A6; --btn-ink:#141914; --chip:#252E26;
  --ok:#9CC17F; --ok-bg:#223022; --warn:#E0B36A; --warn-bg:#352B19; --bad:#EC9481; --bad-bg:#3A221D; --info:#9EC0D4; --info-bg:#1E2B33;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#141914; --paper-2:#1B221C; --card:#192019; --ink:#ECE7DA; --ink-2:#B9B5A7; --ink-3:#8C8C80;
  --forest:#0D130E; --on-forest:#ECE7DA; --olive:#A3AE7C; --bark:#C99E79; --line:#2C352D; --line-2:#3B463C;
  --btn:#C9D2A6; --btn-ink:#141914; --chip:#252E26;
  --ok:#9CC17F; --ok-bg:#223022; --warn:#E0B36A; --warn-bg:#352B19; --bad:#EC9481; --bad-bg:#3A221D; --info:#9EC0D4; --info-bg:#1E2B33;
  color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font:400 17px/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
a{color:inherit}
img{max-width:100%;display:block}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:400;line-height:1.08;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(2.6rem,6vw,4.6rem);font-variation-settings:"opsz" 144}
h2{font-size:clamp(1.9rem,3.6vw,2.9rem);font-variation-settings:"opsz" 120}
h3{font-size:1.45rem;font-variation-settings:"opsz" 48}
h4{font-size:1.15rem}
p{margin:0}
.wrap{max-width:var(--w);margin-inline:auto;padding-inline:var(--gut)}
.eyebrow{font:500 .74rem/1.2 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--olive)}
.lead{font-size:1.12rem;color:var(--ink-2);max-width:60ch}
.muted{color:var(--ink-2)}
.small{font-size:.88rem}
.mono{font-family:var(--f-mono);font-size:.82rem;letter-spacing:.02em}
.num{font-variant-numeric:tabular-nums}
.stack{display:grid;gap:14px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.sec{padding-block:clamp(56px,8vw,104px)}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap;margin-bottom:36px}
.sec-head .stack{max-width:62ch}
hr.rule{border:0;border-top:1px solid var(--line);margin:0}
:focus-visible{outline:2px solid var(--olive);outline-offset:3px}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:10px;font:600 .92rem/1 var(--f-body);letter-spacing:.02em;padding:15px 22px;border-radius:var(--r);border:1px solid var(--btn);background:var(--btn);color:var(--btn-ink);cursor:pointer;text-decoration:none;transition:background .2s,color .2s}
.btn:hover{background:transparent;color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line-2)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.light{background:var(--on-forest);color:#203024;border-color:var(--on-forest)}
.btn.light:hover{background:transparent;color:var(--on-forest)}
.btn.line-light{background:transparent;color:var(--on-forest);border-color:rgba(241,237,226,.55)}
.btn.line-light:hover{border-color:var(--on-forest)}
.btn.sm{padding:9px 14px;font-size:.84rem}
.btn.xs{padding:6px 10px;font-size:.78rem}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:0;font:inherit;color:var(--ink);text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--line-2);cursor:pointer}
.link:hover{text-decoration-color:var(--ink)}
.arrow::after{content:"→";font-family:var(--f-body)}

/* proto ribbon + header */
.skip{position:absolute;left:12px;top:-60px;z-index:80;background:var(--btn);color:var(--btn-ink);border:0;padding:10px 14px;border-radius:var(--r);font:600 .9rem var(--f-body);cursor:pointer}
.skip:focus{top:12px}
#view:focus{outline:none}
.ribbon{background:var(--paper-2);border-bottom:1px solid var(--line);font:500 .74rem/1.4 var(--f-mono);color:var(--ink-2);padding:7px var(--gut);text-align:center;letter-spacing:.04em}
header.site{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hdr{display:flex;align-items:center;gap:24px;min-height:74px}
.brand{display:flex;flex-direction:column;text-decoration:none;line-height:1;margin-right:auto}
.brand b{font:400 1.7rem/1 var(--f-display);color:var(--bark);letter-spacing:-.01em;font-variation-settings:"opsz" 72}
.brand b i{font-style:italic}
.brand small{font:500 .58rem/1 var(--f-mono);letter-spacing:.2em;color:var(--ink-2);margin-top:6px}
nav.main{display:flex;gap:22px}
nav.main a{text-decoration:none;font-size:.92rem;color:var(--ink-2);padding-block:6px;border-bottom:1px solid transparent}
nav.main a:hover,nav.main a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--olive)}
.tools{display:flex;gap:10px;align-items:center}
.icon-btn{position:relative;display:inline-grid;place-items:center;width:42px;height:42px;border:1px solid var(--line);border-radius:var(--r);background:transparent;color:var(--ink);cursor:pointer;text-decoration:none}
.icon-btn:hover{border-color:var(--ink)}
.icon-btn svg{width:19px;height:19px}
.badge-n{position:absolute;top:-6px;right:-6px;min-width:19px;height:19px;border-radius:10px;background:var(--bark);color:#fff;font:600 .7rem/19px var(--f-body);text-align:center;padding-inline:5px}
.lang{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.lang button{background:transparent;border:0;padding:0 10px;height:40px;font:500 .74rem var(--f-mono);color:var(--ink-3);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--chip);color:var(--ink)}
.menu-btn{display:none}
.mnav{display:none;border-top:1px solid var(--line);padding-block:12px 18px}
.mnav a{display:block;padding:10px 0;text-decoration:none;font-size:1.05rem;border-bottom:1px solid var(--line)}
@media (max-width: 1060px){nav.main,.hide-m{display:none}.menu-btn{display:inline-grid}.mnav.open{display:block}}

/* hero */
.hero{position:relative;color:#F4F0E6;background:#16201a;overflow:hidden;isolation:isolate}
.hero .bg{position:absolute;inset:-5%;z-index:0;transform:translate3d(var(--px,0px),calc(var(--py,0px) + var(--sy,0px)),0);transition:transform .9s cubic-bezier(.2,.7,.2,1);will-change:transform}
.hero .bg img{width:100%;height:100%;object-fit:cover;object-position:70% 40%;transform-origin:72% 30%;animation:kb 34s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1.03)}to{transform:scale(1.15) translate(-1.6%,-1%)}}
.hero::after{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(14,20,13,.86) 0%,rgba(14,20,13,.62) 40%,rgba(14,20,13,.05) 72%);pointer-events:none}
.hero .rays{position:absolute;inset:-30% -20% 10% 25%;z-index:2;pointer-events:none;mix-blend-mode:screen;
  background:repeating-conic-gradient(from 196deg at 80% 0%,rgba(255,236,186,0) 0deg,rgba(255,236,186,.13) 2.2deg,rgba(255,236,186,0) 5deg,rgba(255,236,186,0) 9deg);
  -webkit-mask-image:radial-gradient(120% 90% at 80% 0%,#000 10%,transparent 70%);mask-image:radial-gradient(120% 90% at 80% 0%,#000 10%,transparent 70%);
  animation:rays 11s ease-in-out infinite alternate;transform-origin:80% 0%}
@keyframes rays{0%{opacity:.35;transform:rotate(-1.5deg)}50%{opacity:.85}100%{opacity:.5;transform:rotate(1.8deg)}}
.hero canvas.fx{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
.hero .wrap{position:relative;z-index:3;padding-block:clamp(84px,12vw,150px) clamp(72px,9vw,118px)}
.hero .stack{max-width:620px;gap:22px}
.hero h1{color:#F7F3E8}
.hero h1 .w{display:inline-block;white-space:pre;animation:rise 1.1s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(.2s + var(--i) * .09s)}
.hero .rv{animation:rise .9s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--d) * 1s)}
@keyframes rise{from{opacity:0;transform:translateY(22px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.hero .eyebrow{color:#CFD6B0}
.hero p.sub{font-size:1.15rem;color:#E7E2D3;max-width:46ch}
.snd{position:absolute;z-index:4;right:var(--gut);bottom:28px;display:flex;align-items:center;gap:12px;background:rgba(14,20,13,.42);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(241,237,226,.28);color:#F1EDE2;border-radius:40px;padding:9px 16px 9px 12px;font:500 .78rem/1.2 var(--f-mono);letter-spacing:.06em;cursor:pointer;text-align:left;transition:border-color .2s,background .2s}
.snd:hover{border-color:rgba(241,237,226,.7);background:rgba(14,20,13,.6)}
.snd .bars{display:flex;align-items:flex-end;gap:2.5px;height:16px;width:20px}
.snd .bars i{display:block;width:3px;height:4px;border-radius:2px;background:#CFD6B0;transition:height .3s}
.snd[aria-pressed="true"] .bars i{animation:eq 1.2s ease-in-out infinite}
.snd[aria-pressed="true"] .bars i:nth-child(2){animation-delay:-.4s}.snd[aria-pressed="true"] .bars i:nth-child(3){animation-delay:-.8s}.snd[aria-pressed="true"] .bars i:nth-child(4){animation-delay:-.2s}
@keyframes eq{0%,100%{height:4px}50%{height:15px}}
.snd small{display:block;color:#C8C3B4;font-size:.68rem;letter-spacing:.04em;margin-top:2px}
.cue{position:absolute;z-index:3;left:50%;bottom:22px;width:1px;height:46px;background:rgba(241,237,226,.25);overflow:hidden}
.cue::after{content:"";position:absolute;left:0;top:-40%;width:1px;height:40%;background:#F1EDE2;animation:cue 2.4s cubic-bezier(.6,0,.3,1) infinite}
@keyframes cue{to{top:110%}}
@media (prefers-reduced-motion: reduce){.hero .bg img,.hero .rays,.hero h1 .w,.hero .rv,.cue::after{animation:none!important}.hero canvas.fx{display:none}.hero .bg{transition:none}}
@media (max-width:700px){.hero::after{background:linear-gradient(180deg,rgba(14,20,13,.3) 0%,rgba(14,20,13,.85) 70%)}.hero .wrap{padding-top:220px;padding-bottom:104px}.snd{left:var(--gut);right:auto;bottom:24px}.cue{display:none}}

.specimen-strip{border-bottom:1px solid var(--line);background:var(--card)}
.specimen-strip .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
.specimen-strip div{padding:22px 20px;border-left:1px solid var(--line)}
.specimen-strip div:first-child{border-left:0;padding-left:0}
.specimen-strip b{display:block;font:500 .72rem/1.2 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--olive);margin-bottom:6px}
.specimen-strip span{font-size:.93rem;color:var(--ink-2)}
@media (max-width:820px){.specimen-strip .wrap{grid-template-columns:1fr 1fr}.specimen-strip div:nth-child(3){border-left:0;padding-left:0}.specimen-strip div{border-top:1px solid var(--line)}.specimen-strip div:nth-child(-n+2){border-top:0}}

/* product card = specimen label */
.grid{display:grid;gap:clamp(18px,2.4vw,30px)}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:1000px){.g4{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:760px){.g4,.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g2{grid-template-columns:1fr}}
@media (max-width:440px){.g4.tight1{grid-template-columns:1fr}}
.pcard{display:flex;flex-direction:column;text-decoration:none;color:inherit;min-width:0}
.pcard .ph{aspect-ratio:4/5;background:var(--paper-2);overflow:hidden;position:relative;border-radius:2px}
.pcard .ph img{width:100%;height:100%;object-fit:cover;transition:transform .6s ease}
.pcard:hover .ph img{transform:scale(1.035)}
.tag{display:inline-block;font:500 .66rem/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;padding:6px 8px;border-radius:2px;background:var(--card);color:var(--ink)}
.ph .tag{position:absolute;left:10px;top:10px}
.label{border-top:1px solid var(--ink);margin-top:12px;padding-top:10px;display:grid;gap:4px}
.label .sku{font:400 .7rem/1.2 var(--f-mono);color:var(--ink-3);letter-spacing:.06em;display:flex;justify-content:space-between;gap:8px}
.label h4{font-size:1.12rem;line-height:1.2}
.label .meta{display:flex;justify-content:space-between;gap:8px;font-size:.88rem;color:var(--ink-2);flex-wrap:wrap}
.price{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:500}

.chip{display:inline-flex;align-items:center;gap:6px;font:500 .72rem/1 var(--f-mono);letter-spacing:.04em;padding:6px 9px;border-radius:20px;background:var(--chip);color:var(--ink-2);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.info{background:var(--info-bg);color:var(--info)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8}
.chip.plain::before{display:none}

/* collections */
.cat{display:grid;text-decoration:none;color:inherit;gap:12px;min-width:0}
.cat .ph{aspect-ratio:3/4;overflow:hidden;background:var(--paper-2);border-radius:2px}
.cat .ph img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
.cat:hover .ph img{transform:scale(1.04)}
.cat .cap{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);padding-top:10px;gap:8px}
.cat .cap span{font:400 1.2rem/1.2 var(--f-display)}
.cat .cap small{font:.7rem var(--f-mono);color:var(--ink-3)}
.cat.soon .ph{display:grid;place-items:center;border:1px dashed var(--line-2);background:transparent}
.cat-scroll{grid-template-columns:repeat(6,minmax(0,1fr))}
@media (max-width:1000px){.cat-scroll{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.cat-scroll{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* split */
.split{display:grid;grid-template-columns:1.1fr 1fr;gap:clamp(28px,5vw,72px);align-items:center}
.split.rev{grid-template-columns:1fr 1.1fr}
.split > *{min-width:0}
.split .ph{aspect-ratio:5/4;overflow:hidden;border-radius:2px}
.split .ph img{width:100%;height:100%;object-fit:cover}
@media (max-width:860px){.split,.split.rev{grid-template-columns:1fr}}
.featured .ph{aspect-ratio:auto;background:#fff}
.featured .ph img{object-fit:contain}
.spec{display:grid;grid-template-columns:auto 1fr;gap:10px 22px;font-size:.95rem;margin:0}
.spec dt{font:500 .72rem/1.6 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.spec dd{margin:0}

/* usp */
.usp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line)}
.usp > div{padding:28px 26px 30px 0;border-bottom:1px solid var(--line);display:grid;gap:10px;align-content:start}
.usp > div:not(:nth-child(3n+1)){padding-left:26px;border-left:1px solid var(--line)}
.usp h4{font-size:1.25rem}
.usp p{color:var(--ink-2);font-size:.97rem}
@media (max-width:820px){.usp{grid-template-columns:1fr}.usp > div:not(:nth-child(3n+1)){padding-left:0;border-left:0}}

/* process steps */
.steps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:18px;counter-reset:s}
.steps.eight{grid-template-columns:repeat(4,minmax(0,1fr));gap:28px 22px}
.step{display:grid;gap:10px;align-content:start;min-width:0}
.step .ph{aspect-ratio:1;overflow:hidden;border-radius:2px;background:var(--paper-2)}
.step .ph img{width:100%;height:100%;object-fit:cover}
.step .n{font:500 .74rem var(--f-mono);color:var(--olive);letter-spacing:.1em}
.step h4{font-size:1.12rem}
.step p{font-size:.9rem;color:var(--ink-2)}
@media (max-width:1000px){.steps{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:640px){.steps,.steps.eight{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* forest band */
.band{background:var(--forest);color:var(--on-forest)}
.band .eyebrow{color:#C6CFA4}
.band .lead,.band .muted{color:#CFCBBE}
.b2b{display:grid;grid-template-columns:1.2fr 1fr;gap:48px;align-items:start}
.b2b ul{list-style:none;margin:0;padding:0;border-top:1px solid rgba(241,237,226,.2)}
.b2b li{display:flex;justify-content:space-between;gap:16px;padding:16px 0;border-bottom:1px solid rgba(241,237,226,.2);font-size:1rem}

/* ---------------- API: simulated backend ----------------
   Every rule the blueprint assigns to the server lives here:
   prices from catalogue, stock reservation, idempotent payment
   callbacks, role permissions, audit, order snapshots.          */
const API={};
const PERMS={owner:['*'],content:['product','content','catalogue'],sales:['inquiry','quote','order.view','report'],fulfillment:['order.view','order.fulfill']};
const ROLES={owner:{n:'Owner',d:'Akses penuh: harga, role, pengaturan, uji penerimaan.'},content:{n:'Content Admin',d:'Produk, media, konten & katalog. Tidak dapat mengubah harga atau melihat data pembeli.'},sales:{n:'Sales',d:'Inquiry, quotation dan laporan. Melihat pesanan.'},fulfillment:{n:'Fulfillment',d:'Packing, pengiriman & tracking.'}};
function can(role,perm){const p=PERMS[role]||[];return p.includes('*')||p.includes(perm)||p.some(x=>perm.startsWith(x+'.'))}
API.admin=(role,perm,desc,fn)=>{if(!can(role,perm)){const e=new Error(`403 · Role "${ROLES[role]?.n||role}" tidak memiliki izin "${perm}"`);e.code=403;throw e}const r=fn();DB.audit.unshift({at:now(),role,perm,desc});if(DB.audit.length>300)DB.audit.length=300;save();return r};
const isPublic=p=>p&&p.status==='published';
const purchasable=p=>isPublic(p)&&p.price>0&&(p.sale==='retail'||(p.sale==='mto'&&!!p.lead));
const avail=p=>p.mode==='exact'?p.pieces.filter(x=>x.status==='available').length:p.variants.reduce((a,v)=>a+Math.max(0,v.stock-v.reserved),0);
function lineInfo(l){
 const p=DB.products.find(x=>x.id===l.pid);const r={pid:l.pid,ref:l.ref,qty:Math.max(1,parseInt(l.qty)||1),p,ok:true,why:'',unit:0,label:''};
 if(!p||!isPublic(p)){r.ok=false;r.why='unavailable';return r}
 if(!purchasable(p)){r.ok=false;r.why='quote';return r}
 r.unit=p.price;
 if(p.mode==='exact'){r.qty=1;const pc=p.pieces.find(x=>x.id===l.ref);r.label=pc?pc.code:'';if(!pc||pc.status!=='available'){r.ok=false;r.why=pc&&pc.status==='reserved'?'reserved':'sold'}}
 else{const v=p.variants.find(x=>x.id===l.ref);r.label=v?v.label:'';if(!v){r.ok=false;r.why='unavailable'}else if(v.stock-v.reserved<r.qty){r.ok=false;r.why='stock'}}
 return r;
}
API.quote=(lines,zoneId)=>{const items=lines.map(lineInfo);const sub=items.filter(i=>i.ok).reduce((a,i)=>a+i.unit*i.qty,0);const z=DB.settings.zones.find(z=>z.id===zoneId);const ship=z&&z.on?z.rate:0;return{items,sub,ship,total:sub+(items.some(i=>i.ok)?ship:0),zone:z}};
function move(p,ref,delta,reason,refNo){DB.movements.unshift({at:now(),sku:p.sku,ref,delta,reason,refNo});if(DB.movements.length>400)DB.movements.length=400}
function reserve(o){for(const r of o.res){const p=DB.products.find(x=>x.id===r.pid);if(p.mode==='exact'){const pc=p.pieces.find(x=>x.id===r.ref);pc.status='reserved';pc.heldBy=o.no;move(p,pc.code,-1,'reserve',o.no)}else{const v=p.variants.find(x=>x.id===r.ref);v.reserved+=r.qty;move(p,v.label,-r.qty,'reserve',o.no)}}}
function canReserve(o){return o.res.every(r=>{const p=DB.products.find(x=>x.id===r.pid);if(!p)return false;if(p.mode==='exact'){const pc=p.pieces.find(x=>x.id===r.ref);return pc&&pc.status==='available'}const v=p.variants.find(x=>x.id===r.ref);return v&&v.stock-v.reserved>=r.qty})}
function release(o){for(const r of o.res){const p=DB.products.find(x=>x.id===r.pid);if(!p)continue;if(p.mode==='exact'){const pc=p.pieces.find(x=>x.id===r.ref);if(pc&&pc.status==='reserved'&&pc.heldBy===o.no){pc.status='available';delete pc.heldBy;move(p,pc.code,+1,'release',o.no)}}else{const v=p.variants.find(x=>x.id===r.ref);if(v){v.reserved=Math.max(0,v.reserved-r.qty);move(p,v.label,+r.qty,'release',o.no)}}}o.held=false}
function finalize(o){for(const r of o.res){const p=DB.products.find(x=>x.id===r.pid);p.hasOrders=true;if(p.mode==='exact'){const pc=p.pieces.find(x=>x.id===r.ref);pc.status='sold';pc.heldBy=o.no;move(p,pc.code,0,'sold',o.no)}else{const v=p.variants.find(x=>x.id===r.ref);v.reserved=Math.max(0,v.reserved-r.qty);v.stock=Math.max(0,v.stock-r.qty);move(p,v.label,0,'sold',o.no)}}o.held=false}
API.createOrder=(input)=>{
 const errs={};const c=input.customer||{};
 if(!c.name||c.name.trim().length<2)errs.name={en:'Enter the recipient name.',id:'Isi nama penerima.'};
 if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(c.email||''))errs.email={en:'Enter a valid email address.',id:'Isi alamat email yang valid.'};
 if(!/^[+0-9 ()-]{8,}$/.test(c.phone||''))errs.phone={en:'Enter a phone number with at least 8 digits.',id:'Isi nomor telepon minimal 8 digit.'};
 if(!c.address||c.address.trim().length<8)errs.address={en:'Enter the full street address.',id:'Isi alamat lengkap.'};
 if(input.country!=='ID')errs.country={en:'International checkout is not active yet. Send an export inquiry instead.',id:'Checkout internasional belum aktif. Kirim inquiry ekspor.'};
 const z=DB.settings.zones.find(z=>z.id===input.zone);if(!z)errs.zone={en:'Choose a shipping region.',id:'Pilih wilayah pengiriman.'};else if(!z.on)errs.zone={en:`We don't ship to ${z.name} yet. Contact us for alternatives.`,id:`Kami belum mengirim ke ${z.name}. Hubungi kami untuk alternatif.`};
 if(!input.pay)errs.pay={en:'Choose a payment method.',id:'Pilih metode pembayaran.'};
 if(Object.keys(errs).length)return{ok:false,errs};
 const q=API.quote(input.lines,input.zone);
 if(!q.items.length)return{ok:false,errs:{cart:{en:'Your cart is empty.',id:'Keranjang Anda kosong.'}}};
 const bad=q.items.filter(i=>!i.ok);if(bad.length)return{ok:false,errs:{cart:{en:'Some items are no longer available. Review your cart.',id:'Beberapa barang sudah tidak tersedia. Periksa keranjang Anda.'}},bad};
 const no='NE-'+new Date().toISOString().slice(2,7).replace('-','')+'-'+String(++DB.counters.o).padStart(4,'0');
 const o={no,at:now(),customer:{name:c.name.trim(),email:c.email.trim().toLowerCase(),phone:c.phone.trim(),address:c.address.trim(),city:(c.city||'').trim()},zone:z.name,pay:'pending',ful:'unfulfilled',method:input.pay,
  items:q.items.map(i=>({sku:i.p.sku,name:Ltxt(i.p.name),variant:i.label,unit:i.unit,qty:i.qty,img:i.p.images[0]||'',mode:i.p.mode,sale:i.p.sale,lead:i.p.lead?Ltxt(i.p.lead):''})),
  sub:q.sub,ship:q.ship,total:q.total,clientTotal:input.clientTotal,priceTampered:input.clientTotal!=null&&Number(input.clientTotal)!==q.total,
  res:q.items.map(i=>({pid:i.pid,ref:i.ref,qty:i.qty})),held:true,expiresAt:now()+DB.settings.reserveMin*60000,log:[{at:now(),m:'Order created, stock reserved'}],tracking:'',recon:false,notes:''};
 reserve(o);q.items.forEach(i=>{i.p.hasOrders=true}); // any order attempt is a transaction record: lock mode, block hard delete
 DB.orders.unshift(o);save();return{ok:true,order:o};
};
API.payment=(no,type,eventId)=>{ // provider callback (signed in production)
 if(DB.events.includes(eventId))return{dup:true,msg:'Duplicate callback ignored'};
 DB.events.push(eventId);const o=DB.orders.find(x=>x.no===no);if(!o){save();return{err:'Order not found'}}
 if(type==='paid'){
  if(o.pay==='paid'){save();return{dup:true,msg:'Order already paid'}}
  if(o.pay==='pending'){finalize(o);o.pay='paid';o.log.push({at:now(),m:'Payment confirmed by provider'})}
  else if(['expired','failed'].includes(o.pay)){
   if(canReserve(o)){reserve(o);finalize(o);o.pay='paid';o.log.push({at:now(),m:'Late payment received; stock still available, sale completed'})}
   else{o.pay='paid';o.recon=true;o.log.push({at:now(),m:'Late payment received but item no longer available: reconciliation queue'})}
  }
 }else if(type==='failed'&&o.pay==='pending'){o.pay='failed';release(o);o.log.push({at:now(),m:'Payment failed; reservation released'})}
 else if(type==='expired'&&o.pay==='pending'){o.pay='expired';release(o);o.log.push({at:now(),m:'Reservation expired; stock released'})}
 save();return{ok:true,order:o};
};
API.sweep=()=>{let ch=false;for(const o of DB.orders){if(o.pay==='pending'&&o.held&&now()>o.expiresAt){o.pay='expired';release(o);o.log.push({at:now(),m:'Reservation expired; stock released'});ch=true}}if(ch)save();return ch};
API.inquiry=(f)=>{
 const errs={};
 if(!f.name||f.name.trim().length<2)errs.name={en:'Enter your name.',id:'Isi nama Anda.'};
 if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(f.email||''))errs.email={en:'Enter a valid email address.',id:'Isi alamat email yang valid.'};
 if(f.type!=='catalogue'){if(!f.country)errs.country={en:'Choose a country.',id:'Pilih negara.'};if(!f.privacy)errs.privacy={en:'Please agree to the privacy notice so we can reply.',id:'Setujui pemberitahuan privasi agar kami dapat membalas.'}}
 if(Object.keys(errs).length)return{ok:false,errs};
 const no='INQ-2026-'+String(++DB.counters.i).padStart(4,'0');
 const inq=Object.assign({no,at:now(),status:'New',pic:'',notes:'',notify:'pending'},f);
 DB.inquiries.unshift(inq);
 inq.notify=DB.settings.notifyOk?'sent':'failed'; // inquiry is stored first; notification can fail independently
 save();return{ok:true,inq};
};
function sweepTick(){if(REMOTE.on){REMOTE.poll();return}if(API.sweep())render()}
setInterval(sweepTick,5000);

/* ---------------- PRODUCT DETAIL ---------------- */
function vProduct(slug){
 const raw=DB.products.find(p=>p.slug===slug);
 const id=UI.lang==='id';
 if(!raw||(!isPublic(raw)&&UI.preview!==raw.id))return`<section class="phead"><div class="wrap stack"><h1>${id?'Produk tidak ditemukan':'Product not found'}</h1><p class="lead">${id?'Produk ini tidak tersedia atau sudah diarsipkan.':'This product is unavailable or has been archived.'}</p><a class="btn" href="#shop">${t('allprod')}</a></div></section>`;
 const p=view(raw);const S=UI.sel[p.id]||(UI.sel[p.id]={img:0,ref:null,qty:1});
 if(S.img>=p.images.length)S.img=0;
 const exact=p.mode==='exact',buy=purchasable(raw);
 let opts='';
 if(exact){const pcs=p.pieces;if(!S.ref){const f=pcs.find(x=>x.status==='available');S.ref=f?f.id:null}
  opts=`<div class="stack" style="gap:10px"><span class="lbl">${t('choosepiece')}</span><div class="piece">${pcs.map(pc=>`<button type="button" data-act="ref" data-v="${pc.id}" aria-pressed="${S.ref===pc.id}" ${pc.status!=='available'?'disabled':''}><img src="${IMG(pc.img)}" alt=""><span class="mono">${esc(pc.code.split('-').pop())} · ${pc.status==='available'?t('instock'):pc.status==='reserved'?t('reserved'):t('soldout')}</span></button>`).join('')}</div><p class="small muted">${id?'Foto adalah barang yang akan Anda terima. Stok 1 per piece.':'The photo is the item you receive. One in stock per piece.'}</p></div>`}
 else if(p.variants.length){if(!S.ref||!p.variants.find(v=>v.id===S.ref)){const f=p.variants.find(v=>v.stock-v.reserved>0)||p.variants[0];S.ref=f.id}
  const multi=p.variants.length>1||p.variants[0].label!=='One size';
  opts=multi?`<div class="stack" style="gap:10px"><span class="lbl">${t('size')}</span><div class="opt">${p.variants.map(v=>`<button type="button" data-act="ref" data-v="${v.id}" aria-pressed="${S.ref===v.id}" ${buy&&v.stock-v.reserved<=0?'disabled':''}>${esc(v.label)}</button>`).join('')}</div></div>`:'';}
 const v=!exact&&p.variants.find(v=>v.id===S.ref);const left=v?v.stock-v.reserved:0;
 const canAdd=buy&&(exact?!!(S.ref&&p.pieces.find(x=>x.id===S.ref&&x.status==='available')):left>0);
 let action;
 if(p.sale==='quote'||!(p.price>0))action=`<button class="btn arrow" type="button" data-act="quote-for" data-v="${p.sku}">${t('reqprice')}</button>`;
 else if(p.sale==='mto'&&!p.lead)action=`<button class="btn arrow" type="button" data-act="quote-for" data-v="${p.sku}">${t('mto')}</button><p class="small muted">${id?'Waktu produksi belum ditetapkan, jadi pesanan ini diproses lewat inquiry.':'Lead time is not set yet, so this order goes through an inquiry.'}</p>`;
 else action=`<div class="row">${exact?'':`<div class="qty"><button type="button" data-act="qty" data-v="-1" aria-label="Decrease">−</button><input id="qty" inputmode="numeric" value="${S.qty}" aria-label="${t('qty')}"><button type="button" data-act="qty" data-v="1" aria-label="Increase">+</button></div>`}<button class="btn" type="button" data-act="add" ${canAdd?'':'disabled'}>${p.sale==='mto'?t('mto'):t('addcart')}</button><button class="btn ghost" type="button" data-act="buynow" ${canAdd?'':'disabled'}>${t('buynow')}</button></div>`;
 const related=pub().filter(x=>x.cat===p.cat&&x.id!==p.id).slice(0,4);
 document.body.classList.add('has-buybar');
 const bb=$('#buybar');bb.hidden=false;bb.innerHTML=`<div><div class="mono small">${esc(p.sku)}</div>${priceTxt(p)}</div>${(p.sale==='quote'||(p.sale==='mto'&&!p.lead))?`<button class="btn sm" type="button" data-act="quote-for" data-v="${p.sku}">${p.sale==='quote'?t('reqprice'):t('mto')}</button>`:`<button class="btn sm" type="button" data-act="add" ${canAdd?'':'disabled'}>${t('addcart')}</button>`}`;
 return`${UI.preview===raw.id?`<div class="preview-bar"><span>PREVIEW · ${raw.rev?'perubahan draft belum dipublikasi':'produk berstatus '+raw.status}</span><button class="link" type="button" data-act="endpreview">Kembali ke CMS</button></div>`:''}
 <div class="wrap"><div class="crumb" style="padding-top:24px"><a href="#home">Home</a>/<a href="#shop">${t('shop')}</a>/<a href="#shop-${p.cat}">${esc(catName(p.cat))}</a>/<span>${esc(Ltxt(p.name))}</span></div>
 <div class="pd"><div class="gallery"><div class="main">${p.images.length?`<img src="${IMG(p.images[S.img])}" alt="${esc(Ltxt(p.name))}">`:''}</div>${p.images.length>1?`<div class="thumbs">${p.images.map((im,i)=>`<button type="button" data-act="img" data-v="${i}" aria-pressed="${S.img===i}" aria-label="Photo ${i+1}"><img src="${IMG(im)}" alt=""></button>`).join('')}</div>`:''}</div>
 <div class="buy"><div class="stack" style="gap:12px"><span class="eyebrow">${esc(catName(p.cat))} · ${exact?t('exact'):t('pattern')}</span><h1>${L(p.name)}</h1><div class="row">${priceTxt(p)}${stockChip(raw)}</div></div>
  <p class="muted">${L(p.story)}</p>
  ${opts}

API.saveProduct=(role,p,rev,stocks)=>{
 if(!rev.sku)throw new Error('SKU wajib diisi.');
 if(DB.products.some(x=>x.id!==p.id&&(x.sku===rev.sku||(x.rev&&x.rev.sku===rev.sku))))throw new Error('SKU '+rev.sku+' sudah dipakai produk lain. SKU harus unik.');
 const cur=Object.assign({},p,p.rev||{});
 if((rev.price||null)!==(cur.price||null)&&!can(role,'price'))throw Object.assign(new Error('403 · Hanya Owner yang dapat mengubah harga.'),{code:403});
 return API.admin(role,'product.edit',`Simpan draft ${rev.sku}`,()=>{
  if(p.status==='published')p.rev=rev;else{Object.assign(p,rev);p.rev=null}
  stocks.forEach((s,i)=>{const v=p.variants[i];if(v&&s!==v.stock){if(s<v.reserved)throw new Error(`Stok ${v.label} tidak boleh di bawah jumlah yang sedang dipesan (${v.reserved}).`);move(p,v.label,s-v.stock,'adjust','admin');v.stock=s}});
 });
};

/* ---- acceptance tests (Blueprint §17) run against a copy of the data ---- */
function runTests(){
 const backup=DB;SANDBOX=true;const R=[];const ok=(n,c,d)=>R.push({n,c:!!c,d});
 try{
  DB=clone(backup);DB.orders=[];DB.events=[];DB.inquiries=[];DB.audit=[];DB.movements=[];
  const cust={name:'Uji Pembeli',email:'uji@example.com',phone:'+62 812 0000 0000',address:'Jl. Contoh No. 1, Balikpapan'};
  const exact=DB.products.find(p=>p.mode==='exact'&&p.status==='published');exact.pieces.forEach(x=>x.status='available');const pc=exact.pieces[0];
  const mk=(lines,z='kal',extra={})=>API.createOrder(Object.assign({lines,customer:cust,country:'ID',zone:z,pay:'QRIS (simulasi)'},extra));
  // 1 draft not public
  const dr=DB.products.find(p=>p.status==='draft');ok('Draft tidak tampil di toko',!pub().includes(dr)&&!lineInfo({pid:dr.id,ref:null}).ok,'Produk draft '+dr.sku+' tidak publik dan tidak bisa dibeli.');
  // 2 exact piece concurrency
  const a=mk([{pid:exact.id,ref:pc.id,qty:1}]);const b=mk([{pid:exact.id,ref:pc.id,qty:1}]);
  ok('Exact piece tidak oversold pada dua checkout bersamaan',a.ok&&!b.ok,'Checkout pertama berhasil, kedua ditolak: '+Ltxt(b.errs?.cart||''));
  // 3 duplicate callback
  const r1=API.payment(a.order.no,'paid','evt-1');const r2=API.payment(a.order.no,'paid','evt-1');const r3=API.payment(a.order.no,'paid','evt-2');
  ok('Callback duplikat tidak membuat pembayaran ganda',r1.ok&&r2.dup&&r3.dup&&DB.orders.filter(o=>o.pay==='paid').length===1&&pc.status==='sold','Event sama diabaikan; event berbeda untuk order paid juga diabaikan.');
  // 4 expired reservation releases
  const pv=DB.products.find(p=>isPublic(p)&&p.mode==='pattern'&&p.sale==='retail'&&p.price>0&&p.variants.some(v=>v.stock-v.reserved>1));const vv=pv.variants.find(v=>v.stock>1);const before=vv.stock-vv.reserved;
  const c=mk([{pid:pv.id,ref:vv.id,qty:1}]);const mid=vv.stock-vv.reserved;c.order.expiresAt=now()-1;API.sweep();
  ok('Reservasi kedaluwarsa kembali tersedia',mid===before-1&&vv.stock-vv.reserved===before&&c.order.pay==='expired',`Tersedia ${before} → ${mid} saat dipesan → ${vv.stock-vv.reserved} setelah expired.`);
  // 5 failed payment releases
  const d=mk([{pid:pv.id,ref:vv.id,qty:1}]);API.payment(d.order.no,'failed','evt-3');ok('Pembayaran gagal melepas stok',d.order.pay==='failed'&&vv.stock-vv.reserved===before,'Status failed, stok kembali '+before+'.');
  // 6 tampered price
  const e=mk([{pid:pv.id,ref:vv.id,qty:1,price:1}],'kal',{clientTotal:1});const exp=pv.price+DB.settings.zones[0].rate;
  ok('Harga dari browser tidak diterima',e.ok&&e.order.total===exp&&e.order.priceTampered,`Browser kirim Rp1, server menetapkan ${rp(exp)}.`);API.payment(e.order.no,'expired','evt-4');
  // 7 unserved zone & out-of-stock variant
  const f=mk([{pid:pv.id,ref:vv.id,qty:1}],'pap');const zero=DB.products.find(p=>isPublic(p)&&p.variants.some(v=>v.stock===0)&&p.sale==='retail');const zv=zero.variants.find(v=>v.stock===0);const g=mk([{pid:zero.id,ref:zv.id,qty:1}]);
  ok('Wilayah tanpa layanan & varian habis tidak bisa checkout',!f.ok&&f.errs.zone&&!g.ok,'Papua ditolak; '+zero.sku+' '+zv.label+' (stok 0) ditolak.');
  // 8 snapshot unchanged after product edit
  const snapName=a.order.items[0].name,snapPrice=a.order.items[0].unit;Object.assign(exact,{name:{en:'Renamed',id:'Renamed'},price:1});
  ok('Edit produk tidak mengubah snapshot pesanan lama',a.order.items[0].name===snapName&&a.order.items[0].unit===snapPrice,'Snapshot tetap "'+snapName+'" '+rp(snapPrice)+'.');
  // 9 archived not purchasable
  const ar=DB.products.find(p=>p.id===pv.id);ar.status='archived';ok('Produk archived tidak bisa dibeli, histori tetap',!lineInfo({pid:ar.id,ref:vv.id,qty:1}).ok&&DB.orders.some(o=>o.items.some(i=>i.sku===ar.sku)),'Pesanan lama untuk '+ar.sku+' tetap ada.');ar.status='published';
  // 10 restricted role
  let denied=0;try{API.admin('fulfillment','product.edit','x',()=>{})}catch(x){if(x.code===403)denied++}try{API.saveProduct('content',pv,Object.assign({},pv,{price:pv.price+1}),pv.variants.map(v=>v.stock))}catch(x){if(x.code===403)denied++}try{API.admin('sales','settings','role',()=>{})}catch(x){if(x.code===403)denied++}
  ok('Role terbatas ditolak oleh API',denied===3,'Fulfillment edit produk, Content Admin ubah harga, Sales ubah pengaturan: ketiganya 403.');
  // 11 inquiry saved despite notify failure
  DB.settings.notifyOk=false;const iq=API.inquiry({type:'export',name:'Buyer Uji',email:'b@example.com',country:'Japan',privacy:true,sku:'NE-BAG-EC-001'});
  ok('Inquiry tersimpan dengan nomor walau notifikasi gagal',iq.ok&&/INQ-2026-\d{4}/.test(iq.inq.no)&&iq.inq.notify==='failed'&&DB.inquiries.length===1,iq.inq?.no+' tersimpan, notifikasi: failed (bisa dikirim ulang).');
  // 12 FOB not retail
  const fq=DB.products.find(p=>isPublic(p)&&p.sale==='quote'&&p.fob);ok('Harga FOB tidak terbaca sebagai harga retail',!purchasable(fq)&&!fq.price,fq.sku+' punya referensi FOB USD '+fq.fob.usd+' tetapi tidak punya harga retail sehingga hanya bisa inquiry.');
  // 13 late payment on sold piece → reconciliation
  const ex2=DB.products.filter(p=>p.mode==='exact'&&p.status==='published')[1];const p2=ex2.pieces[0];p2.status='available';const h=mk([{pid:ex2.id,ref:p2.id,qty:1}]);API.payment(h.order.no,'expired','evt-5');const i2=mk([{pid:ex2.id,ref:p2.id,qty:1}]);API.payment(i2.order.no,'paid','evt-6');API.payment(h.order.no,'paid','evt-7');
  ok('Pembayaran terlambat untuk barang terjual masuk rekonsiliasi',h.order.recon&&p2.status==='sold'&&i2.order.pay==='paid','Order pertama ditandai rekonsiliasi; barang tidak dijanjikan ganda.');
 }catch(err){ok('Eksekusi uji',false,err.message)}
 finally{DB=backup;SANDBOX=false}
 return R;
}

/* =========================================================
   HERO FX — drifting leaves, light motes, parallax
   ========================================================= */
const RM=window.matchMedia?matchMedia('(prefers-reduced-motion: reduce)'):{matches:false};
const FX={cv:null,ctx:null,raf:0,leaves:[],motes:[],w:0,h:0,dpr:1,mx:0,my:0,t0:0,last:0};
const LEAF_COL=['#C9932E','#8C9A4B','#B5562F','#D8B465','#6E7F3A','#A8652F','#7A4A2A'];
function fxSize(){const r=FX.cv.getBoundingClientRect();FX.dpr=Math.min(2,window.devicePixelRatio||1);FX.w=r.width;FX.h=r.height;FX.cv.width=Math.round(r.width*FX.dpr);FX.cv.height=Math.round(r.height*FX.dpr);FX.ctx.setTransform(FX.dpr,0,0,FX.dpr,0,0)}
function mkLeaf(top){const d=.35+Math.random()*.65;return{x:Math.random()*(FX.w+200)-40,y:top?-30-Math.random()*FX.h*.6:Math.random()*FX.h,d,s:(6+Math.random()*9)*(.6+d*.7),vy:(.25+Math.random()*.55)*(.5+d),ph:Math.random()*6.28,fr:.6+Math.random()*1.4,rot:Math.random()*6.28,vr:(Math.random()-.5)*.02,c:LEAF_COL[Math.random()*LEAF_COL.length|0],a:.55+d*.4}}
function mkMote(){return{x:FX.w*(.45+Math.random()*.55),y:Math.random()*FX.h,r:.6+Math.random()*1.7,vy:-(.05+Math.random()*.18),ph:Math.random()*6.28,tw:.5+Math.random()*1.5}}
function heroMount(){
 const cv=document.querySelector('#hero canvas.fx');
 if(!cv){FX.cv=null;cancelAnimationFrame(FX.raf);return}
 if(FX.cv===cv)return;
 FX.cv=cv;FX.ctx=cv.getContext('2d');fxSize();
 if(RM.matches)return;
 const n=FX.w<700?12:24;FX.leaves=Array.from({length:n},()=>mkLeaf(false));FX.motes=Array.from({length:FX.w<700?18:36},mkMote);
 cancelAnimationFrame(FX.raf);FX.last=performance.now();FX.raf=requestAnimationFrame(fxLoop);
}
function drawLeaf(c,L,t){
 c.save();c.translate(L.x+FX.mx*14*L.d,L.y+FX.my*8*L.d);c.rotate(L.rot);
 const flip=Math.cos(t*.0012*L.fr+L.ph);c.scale(Math.max(.15,Math.abs(flip))*L.s,L.s);
 c.globalAlpha=L.a;c.fillStyle=L.c;
 c.beginPath();c.moveTo(0,-1);c.bezierCurveTo(.62,-.55,.58,.55,0,1.05);c.bezierCurveTo(-.58,.55,-.62,-.55,0,-1);c.fill();
 c.globalAlpha=L.a*.55;c.strokeStyle='rgba(255,240,205,.8)';c.lineWidth=.07;c.beginPath();c.moveTo(0,-.9);c.lineTo(0,1.25);c.stroke();
 c.restore();
}
function fxLoop(now){
 FX.raf=requestAnimationFrame(fxLoop);
 if(!FX.cv||!FX.cv.isConnected){cancelAnimationFrame(FX.raf);FX.cv=null;return}
 if(document.hidden)return;
 const r=FX.cv.getBoundingClientRect();if(r.bottom<0)return; // off-screen: skip work
 const dt=Math.min(50,now-FX.last)/16.7;FX.last=now;
 const c=FX.ctx;c.clearRect(0,0,FX.w,FX.h);
 const wind=Math.sin(now*.00023)*.55+Math.sin(now*.00071)*.25-.25;
 for(const m of FX.motes){m.y+=m.vy*dt;m.x+=Math.sin(now*.0004+m.ph)*.12*dt+wind*.05;if(m.y<-5){m.y=FX.h+5;m.x=FX.w*(.45+Math.random()*.55)}
  const a=.18+.32*(.5+.5*Math.sin(now*.002*m.tw+m.ph));c.globalAlpha=a;c.fillStyle='#FFE9B8';c.beginPath();c.arc(m.x+FX.mx*6,m.y+FX.my*4,m.r,0,6.283);c.fill()}
 c.globalAlpha=1;
 for(const L of FX.leaves){L.y+=L.vy*dt;L.x+=(wind*L.d*.9+Math.sin(now*.0011*L.fr+L.ph)*.55)*dt;L.rot+=L.vr*dt+Math.sin(now*.0009+L.ph)*.004;
  if(L.y>FX.h+30||L.x<-60||L.x>FX.w+80)Object.assign(L,mkLeaf(true));drawLeaf(c,L,now)}
}
window.addEventListener('resize',()=>{if(FX.cv)fxSize()});
document.addEventListener('pointermove',e=>{const h=document.getElementById('hero');if(!h||RM.matches||e.pointerType==='touch')return;const r=h.getBoundingClientRect();if(e.clientY>r.bottom)return;
 FX.mx=(e.clientX/r.width-.5);FX.my=((e.clientY-r.top)/r.height-.5);h.style.setProperty('--px',(-FX.mx*22).toFixed(1)+'px');h.style.setProperty('--py',(-FX.my*14).toFixed(1)+'px')},{passive:true});
window.addEventListener('scroll',()=>{const h=document.getElementById('hero');if(!h||RM.matches)return;const y=window.scrollY;if(y<h.offsetHeight+200)h.style.setProperty('--sy',(y*.28).toFixed(1)+'px')},{passive:true});

/* =========================================================
   AMBIENCE — forest bed + trickling stream, synthesised (no files)
   Very quiet by design; starts only after the visitor's first gesture
   (browsers block audio before that) and only on the home page.
   ========================================================= */
const AMB={ctx:null,master:null,on:false,armed:true,timer:0,next:0,bird:0,stream:null,level:.32};
try{if(localStorage.getItem(KEY+'-sound')==='off')AMB.armed=false}catch(e){}
function noiseBuf(C,secs,brown){const n=C.sampleRate*secs|0,b=C.createBuffer(2,n,C.sampleRate);for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);let last=0;for(let i=0;i<n;i++){const w=Math.random()*2-1;if(brown){last=(last+.02*w)/1.02;d[i]=last*3.5}else d[i]=w}}return b}
function ambGraph(C,dest){
 const white=noiseBuf(C,4,false),brown=noiseBuf(C,6,true);
 const loop=(buf,off)=>{const s=C.createBufferSource();s.buffer=buf;s.loop=true;s.start(0,off||0);return s};
 const chain=(...n)=>{for(let i=0;i<n.length-1;i++)n[i].connect(n[i+1]);return n[n.length-1]};
 const bq=(type,f,q)=>{const b=C.createBiquadFilter();b.type=type;b.frequency.value=f;b.Q.value=q||.7;return b};
 const g=v=>{const x=C.createGain();x.gain.value=v;return x};
 const pan=p=>{const x=C.createStereoPanner?C.createStereoPanner():g(1);if(x.pan)x.pan.value=p;return x};
 const lfo=(hz,depth,param)=>{const o=C.createOscillator();o.frequency.value=hz;const d=g(depth);o.connect(d);d.connect(param);o.start();return o};
 // 1. forest air: deep, slow-breathing brown noise
 const bedG=g(.16);chain(loop(brown,.3),bq('lowpass',380,.5),bedG,dest);lfo(.045,.06,bedG.gain);
 // 2. canopy rustle: soft high band that swells with the wind
 const rus=g(.012);chain(loop(white,1.1),bq('bandpass',2600,.6),bq('lowpass',5200,.5),rus,pan(.3),dest);lfo(.11,.009,rus.gain);
 // 3. stream: two water bands, gain wobbled by the scheduler for a trickling texture
 const st=g(.03),st2=g(.012);chain(loop(white,2.2),bq('bandpass',950,1.4),st,pan(-.45),dest);chain(loop(white,.7),bq('bandpass',2300,2.2),st2,pan(-.35),dest);
 // 4. distant insects: narrow high band, pulsing
 const ins=g(.0016);chain(loop(white,3.1),bq('bandpass',6100,9),ins,pan(.55),dest);lfo(13,.0012,ins.gain);
 return{st,st2};
}
function ambEvents(C,dest,S,from,to){
 // stream wobble (every ~70 ms)
 for(let t=Math.max(from,S.wob||0);t<to;t+=.07){S.st.gain.setTargetAtTime(.018+Math.random()*.026,t,.03);S.st2.gain.setTargetAtTime(.006+Math.random()*.014,t,.025);S.wob=t+.07}
 // water droplets / bubbles
 let t=Math.max(from,S.drop||from);
 while(t<to){t+=.04+Math.random()*Math.random()*.32;if(t>=to)break;
  const o=C.createOscillator(),e=C.createGain(),p=C.createStereoPanner?C.createStereoPanner():null,f=520+Math.random()*1100,d=.03+Math.random()*.06,a=.006+Math.random()*.014;
  o.type='sine';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*(1.5+Math.random()),t+d);
  e.gain.setValueAtTime(0,t);e.gain.linearRampToValueAtTime(a,t+.004);e.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(e);if(p){p.pan.value=-.75+Math.random()*.55;e.connect(p);p.connect(dest)}else e.connect(dest);o.start(t);o.stop(t+d+.02)}
 S.drop=t;
 // distant birds: a short phrase every 5–14 s
 if(!S.bird)S.bird=from+2+Math.random()*3;
 while(S.bird<to){const bt=S.bird,n=2+Math.random()*4|0,base=2600+Math.random()*1700,pp=-.8+Math.random()*1.6;

 AMB.ctx=C;AMB.master=master;AMB.S=ambGraph(C,master);
 AMB.timer=setInterval(()=>{if(C.state!=='running')return;const now=C.currentTime;ambEvents(C,master,AMB.S,Math.max(now,AMB.next||now),now+.35);AMB.next=now+.35},120);return true}

function loadScript(src){return new Promise((res,rej)=>{const t=document.createElement('script');t.src=src;t.onload=res;t.onerror=()=>rej(new Error('Could not load '+src));document.head.appendChild(t)})}

 DB.orders=s.orders.concat(mine.filter(o=>!s.orders.some(x=>x.no===o.no)));DB.inquiries=s.inquiries;DB.quotes=s.quotes;DB.audit=s.audit;DB.movements=s.movements;UI.role=s.role};

 case'menu':{const m=$('#mnav');m.classList.toggle('open');$('#menubtn').setAttribute('aria-expanded',m.classList.contains('open'));break}
 case'cat':UI.shopCat=v;go(v==='all'?'shop':'shop-'+v);break;
 case'clearq':UI.q='';render(true);break;
 case'ref':{const p=cur();UI.sel[p.id].ref=v;UI.sel[p.id].qty=1;render(true);break}
 case'img':{const p=cur();UI.sel[p.id].img=+v;render(true);break}
 case'qty':{const p=cur();const S=UI.sel[p.id];S.qty=Math.max(1,(parseInt($('#qty').value)||1)+(+v));render(true);break}
 case'add':case'buynow':{const p=cur();const S=UI.sel[p.id];const q=$('#qty');if(q)S.qty=parseInt(q.value)||1;if(addToCart(p,S)){if(a==='buynow')go('checkout');else{toast((id?'Ditambahkan: ':'Added: ')+Ltxt(p.name));render(true)}}break}
 case'cqty':{const l=DB.cart[+b.dataset.i];const nq=l.qty+(+v);if(nq<1)break;const li=lineInfo({...l,qty:nq});if(!li.ok&&+v>0){toast(id?'Stok tidak cukup.':'Not enough stock.');break}l.qty=nq;save();render(true);break}
 case'rm':DB.cart.splice(+b.dataset.i,1);save();render(true);break;
 case'quote-for':INQ.pre={sku:v,type:'wholesale'};INQ.errs={};go('wholesale');setTimeout(()=>$('#inqform')?.scrollIntoView({behavior:'smooth'}),80);break;
 case'cart-to-inq':{const items=API.quote(DB.cart).items;INQ.pre={type:'export',country:CO.country,sku:items.map(i=>i.p?.sku).join(', '),qty:items.map(i=>i.qty+'× '+(i.label||'')).join(', ')};go('wholesale');break}
 case'pay':{const o=DB.orders.find(x=>x.no===b.dataset.no);const evt=b.dataset.dup?(o.lastEvt||'evt'):uid('evt_');o.lastEvt=o.lastEvt||evt;if(!b.dataset.dup)o.lastEvt=evt;const r=API.payment(o.no,v,evt);if(r.dup)toast(id?'Callback duplikat diabaikan. Tidak ada pembayaran ganda.':'Duplicate callback ignored. No double payment.');else if(v==='paid'&&o.pay==='paid'){DB.cart=DB.cart.filter(l=>!o.res.some(x=>x.pid===l.pid&&x.ref===l.ref));save();toast(o.recon?(id?'Masuk antrean rekonsiliasi.':'Sent to reconciliation queue.'):(id?'Pembayaran terverifikasi.':'Payment verified.'))}render(true);break}
 case'copy':navigator.clipboard?.writeText(v).then(()=>toast(id?'Disalin.':'Copied.'),()=>toast(v));break;
 case'endpreview':UI.preview=null;UI.tab='products';go('admin');break;
 /* admin */
 case'role':UI.role=v;UI.tab='dash';UI.editId=null;render();break;
 case'logout':UI.role=null;render();break;
 case'tab':UI.tab=v;UI.qErr='';render();break;
 case'p-edit':UI.editId=v;UI.confirmDel=null;render(true);break;
 case'p-new':{API.admin(UI.role,'product.create','Produk baru',()=>{const n=DB.products.length+1;const p=prod({id:uid('p'),slug:'new-product-'+n,sku:'NE-NEW-'+String(n).padStart(3,'0'),cat:'fashion',status:'draft',name:{en:'New product',id:''},story:{en:'',id:''},material:{en:'',id:''},size:{en:'',id:''},mode:'pattern',sale:'retail',variants:V(['One size'],[0])});DB.products.unshift(p);UI.editId=p.id});render(true);break}
 case'p-dup':{const s=DB.products.find(p=>p.id===UI.editId);API.admin(UI.role,'product.create','Duplikat '+s.sku,()=>{const p=clone(s);Object.assign(p,{id:uid('p'),sku:s.sku+'-COPY',slug:s.slug+'-copy',status:'draft',hasOrders:false,rev:null,featured:false});p.variants.forEach(v=>{v.stock=0;v.reserved=0});p.pieces=[];DB.products.unshift(p);UI.editId=p.id});toast('Duplikat dibuat sebagai draft.');render(true);break}
 case'p-preview':{const p=DB.products.find(p=>p.id===UI.editId);UI.preview=p.id;UI.sel[p.id]=null;location.hash='p-'+(p.rev?.slug||p.slug);break}
 case'p-publish':{const p=DB.products.find(p=>p.id===UI.editId);API.admin(UI.role,'product.publish','Publish '+p.sku,()=>{const r=Object.assign({},p,p.rev||{});if(!r.images.length)throw new Error('Tambahkan minimal satu foto sebelum publish.');if(!r.name.en)throw new Error('Nama EN wajib diisi.');if(p.rev){Object.assign(p,p.rev);p.rev=null}p.status='published'});toast('Dipublikasikan. Produk tampil di toko.');render(true);break}
 case'p-status':{const p=DB.products.find(p=>p.id===UI.editId);API.admin(UI.role,'product.status',`${p.sku} → ${v}`,()=>{p.status=v});toast(v==='archived'?'Diarsipkan. Histori pesanan tetap utuh.':'Status: '+v);render(true);break}
 case'p-del':UI.confirmDel=UI.editId;render(true);break;
 case'p-del-no':UI.confirmDel=null;render(true);break;
 case'p-del-yes':{const p=DB.products.find(p=>p.id===UI.editId);API.admin(UI.role,'product.delete','Hapus '+p.sku,()=>{if(p.hasOrders||p.status!=='draft')throw new Error('Hanya draft tanpa transaksi yang bisa dihapus. Gunakan Archive.');DB.products=DB.products.filter(x=>x!==p)});UI.editId=null;UI.confirmDel=null;toast('Draft dihapus.');render(true);break}
 case'img-rm':{const p=DB.products.find(p=>p.id===UI.editId);const {rev,stocks}=readEditor(p);rev.images.splice(+v,1);API.saveProduct(UI.role,p,rev,stocks);render(true);break}
 case'piece-add':{const p=DB.products.find(p=>p.id===UI.editId);API.admin(UI.role,'product.edit','Tambah piece '+p.sku,()=>{const n=p.pieces.length+1;p.pieces.push({id:uid('pc'),code:p.sku+'-P'+String(n).padStart(2,'0'),label:p.pieces[0]?.label||'',img:p.images[0]||'',status:'available'});move(p,'P'+n,+1,'new piece','admin')});render(true);break}
 case'var-add':{const p=DB.products.find(p=>p.id===UI.editId);const l=$('#e-newvar').value.trim();if(!l)break;API.admin(UI.role,'product.edit','Tambah varian '+l,()=>{if(p.variants.some(x=>x.label===l))throw new Error('Varian sudah ada.');p.variants.push({id:'v-'+l.toLowerCase().replace(/[^a-z0-9]/g,'')+uid(''),label:l,stock:0,reserved:0})});render(true);break}
 case'o-sel':UI.orderSel=v;render(true);break;
 case'o-ful':{const o=DB.orders.find(x=>x.no===UI.orderSel);API.admin(UI.role,'order.fulfill',`${o.no} → ${v}`,()=>{const tr=$('#o-track').value.trim();if(v==='shipped'&&!tr)throw new Error('Isi nomor resi sebelum menandai dikirim.');o.tracking=tr;o.ful=v;o.log.push({at:now(),m:'Fulfillment: '+v+(v==='shipped'?' · '+tr:'')})});render(true);break}
 case'o-save':{const o=DB.orders.find(x=>x.no===UI.orderSel);API.admin(UI.role,'order.fulfill','Catatan '+o.no,()=>{o.tracking=$('#o-track').value.trim();o.notes=$('#o-notes').value});toast('Tersimpan.');render(true);break}
 case'o-cancel':{const o=DB.orders.find(x=>x.no===UI.orderSel);API.admin(UI.role,'order.cancel','Batalkan '+o.no,()=>{release(o);o.pay='expired';o.ful='cancelled';o.log.push({at:now(),m:'Cancelled by admin; stock released'})});render(true);break}
 case'o-refund':{const o=DB.orders.find(x=>x.no===UI.orderSel);API.admin(UI.role,'order.refund','Refund '+o.no,()=>{o.pay='refunded';o.recon=false;o.log.push({at:now(),m:'Full refund recorded'})});render(true);break}
 case'o-restock':{const o=DB.orders.find(x=>x.no===UI.orderSel);API.admin(UI.role,'order.fulfill','Restok retur '+o.no,()=>{for(const r of o.res){const p=DB.products.find(x=>x.id===r.pid);if(!p)continue;if(p.mode==='exact'){const pc=p.pieces.find(x=>x.id===r.ref);if(pc){pc.status='available';delete pc.heldBy}}else{const vv=p.variants.find(x=>x.id===r.ref);if(vv)vv.stock+=r.qty}move(p,r.ref,+r.qty,'return restock',o.no)}o.restocked=true;o.log.push({at:now(),m:'Returned items inspected and restocked'})});render(true);break}
 case'i-sel':UI.inqSel=v;UI.qErr='';render(true);break;
 case'i-save':{const q=DB.inquiries.find(x=>x.no===UI.inqSel);API.admin(UI.role,'inquiry.edit',`${q.no} → ${$('#i-status').value}`,()=>{q.status=$('#i-status').value;q.pic=$('#i-pic').value==='—'?'':$('#i-pic').value;if(q.status==='New'&&q.pic)q.status='Assigned'});toast('Status inquiry tersimpan.');render(true);break}
 case'i-retry':{const q=DB.inquiries.find(x=>x.no===UI.inqSel);API.admin(UI.role,'inquiry.notify','Kirim ulang notifikasi '+q.no,()=>{q.notify=DB.settings.notifyOk?'sent':'failed'});toast(q.notify==='sent'?'Notifikasi terkirim.':'Masih gagal. Periksa pengaturan email.');render(true);break}
 case'q-send':case'q-approve':{const [no,ver]=v.split('|');const x=DB.quotes.find(q=>q.no===no&&q.ver===+ver);API.admin(UI.role,'quote.edit',`${no} v${ver} ${a==='q-send'?'sent':'approved'}`,()=>{x.status=a==='q-send'?'Sent':'Approved';const q=DB.inquiries.find(i=>i.no===x.inq);q.status=a==='q-send'?'Quotation Sent':'Approved'});render(true);break}
 case'k-save':API.admin(UI.role,'contact.edit','Kontak & legalitas',()=>{const r=document.querySelector('input[name=activePhone]:checked');DB.contact.activePhone=r&&r.value!==''?+r.value:null;DB.contact.addressConfirmed=$('#k-addr').checked;document.querySelectorAll('[data-legal]').forEach(c=>DB.contact.legal[+c.dataset.legal].verified=c.checked)});toast('Kontak tersimpan.');render(true);break;
 case'cat-save':API.admin(UI.role,'catalogue.edit','Katalog versi baru',()=>{document.querySelectorAll('[data-catp]').forEach(c=>{const p=DB.products.find(x=>x.id===c.dataset.catp);p.catalogue=c.checked});const m=DB.catalogueMeta;const [maj,min]=m.version.split('.').map(Number);m.version=maj+'.'+(min+1);m.date=new Date().toISOString().slice(0,10)});toast('Katalog v'+DB.catalogueMeta.version+' tersimpan.');render(true);break;
 case'copy-csv':{const tx=$('#csv');navigator.clipboard?.writeText(tx.value).then(()=>toast('CSV disalin.'),()=>{tx.select();toast('Tekan Ctrl/Cmd+C untuk menyalin.')});break}
 case'reset':UI.confirmReset=true;render(true);break;case'reset-no':UI.confirmReset=false;render(true);break;
 case'reset-yes':API.admin(UI.role,'settings','Reset demo',()=>{});DB=seed();UI.confirmReset=false;UI.editId=null;UI.orderSel=null;UI.inqSel=null;save();toast('Data demo direset.');render(true);break;
 case'run-tests':UI.tests=runTests();render(true);break;
 }}catch(err){toast(err.message);render(true)}
});
document.addEventListener('change',e=>{
 const el=e.target;
 if(REMOTE.on&&REMOTE.change(el))return;
 if(el.id==='sort'){UI.sort=el.value;render(true)}
 else if(el.id==='c-country'){CO.country=el.value;readCO();render(true)}
 else if(el.id==='c-zone'){CO.zone=el.value;readCO();render(true)}
 else if(el.name==='pay'){CO.pay=el.value}
 else if(el.id==='e-addimg'&&el.value){const p=DB.products.find(p=>p.id===UI.editId);const {rev,stocks}=readEditor(p);rev.images.push(el.value);try{API.saveProduct(UI.role,p,rev,stocks)}catch(x){toast(x.message)}render(true)}
 else if(el.id==='e-upload'&&el.files[0]){const f=el.files[0];if(f.size>2.5e6){toast('File terlalu besar. Maksimal 2,5 MB untuk prototype.');return}const rd=new FileReader();rd.onload=()=>{const p=DB.products.find(p=>p.id===UI.editId);const {rev,stocks}=readEditor(p);rev.images.push(rd.result);try{API.saveProduct(UI.role,p,rev,stocks);toast('Foto diunggah ke draft.')}catch(x){toast(x.message)}render(true)};rd.readAsDataURL(f)}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){UI.q=e.target.value;clearTimeout(UI._qt);UI._qt=setTimeout(()=>{const pos=e.target.selectionStart;render(true);const q=$('#q');q.focus();q.setSelectionRange(pos,pos)},250)}});
function readCO(){const g=i=>$('#'+i)?.value;CO.c={name:g('c-name')??CO.c.name,email:g('c-email')??CO.c.email,phone:g('c-phone')??CO.c.phone,address:g('c-address')??CO.c.address,city:g('c-city')??CO.c.city};const pm=document.querySelector('input[name=pay]:checked');if(pm)CO.pay=pm.value}
document.addEventListener('submit',e=>{
 e.preventDefault();const f=e.target;const g=i=>($('#'+i)?.value||'').trim();const id=UI.lang==='id';
 if(REMOTE.on&&REMOTE.submit(f,g))return;
 try{
 if(f.id==='coform'){readCO();const r=API.createOrder({lines:DB.cart,customer:CO.c,country:CO.country==='ID'?'ID':CO.country,zone:CO.zone,pay:CO.pay,clientTotal:+g('c-total')});if(!r.ok){CO.errs=r.errs;render(true);const first=document.querySelector('.err');first?.closest('.fld')?.querySelector('input,select,textarea')?.focus();return}CO.errs={};go('pay-'+r.order.no)}
 else if(f.id==='osform'){OS.no=g('os-no').toUpperCase();OS.email=g('os-email').toLowerCase();const o=DB.orders.find(x=>x.no===OS.no&&x.customer.email===OS.email);OS.found=o?o.no:null;OS.err=o?'':(id?'Pesanan tidak ditemukan. Periksa nomor dan email.':'No order matches that number and email.');render(true)}
 else if(f.id==='inqform'){const d={type:g('i-type'),name:g('i-name'),company:g('i-company'),email:g('i-email'),wa:g('i-wa'),country:g('i-country'),btype:g('i-btype'),sku:g('i-sku'),qty:g('i-qty'),spec:g('i-spec'),when:g('i-when'),dest:g('i-dest'),brand:g('i-brand'),pack:g('i-pack'),notes:g('i-notes'),file:$('#i-file')?.files[0]?.name||'',privacy:$('#i-privacy').checked,mkt:$('#i-mkt').checked};const r=API.inquiry(d);if(!r.ok){INQ.errs=r.errs;INQ.pre=d;render(true);$('#inqform').scrollIntoView({behavior:'smooth'});return}INQ={pre:{},errs:{},done:r.inq};go('inq-done')}
 else if(f.id==='catform'){const r=API.inquiry({type:'catalogue',name:g('k-name'),email:g('k-email'),company:g('k-company'),country:g('k-country'),privacy:true});if(!r.ok){CATF.errs=r.errs;render(true);return}CATF.errs={};INQ.done=r.inq;go('inq-done')}
 else if(f.id==='pform'){const p=DB.products.find(p=>p.id===f.dataset.id);const {rev,stocks}=readEditor(p);API.saveProduct(UI.role,p,rev,stocks);toast(p.status==='published'?'Draft tersimpan. Preview lalu publish untuk menampilkan di toko.':'Tersimpan.');render(true)}
 else if(f.id==='qform'){const q=DB.inquiries.find(x=>x.no===UI.inqSel);const price=parseFloat(g('q-price').replace(',','.'));if(!(price>0)||!g('q-valid')||!g('q-lead')||!g('q-terms')){UI.qErr='Isi harga per unit, masa berlaku, lead time dan termin pembayaran.';render(true);return}UI.qErr='';API.admin(UI.role,'quote.create','Quotation untuk '+q.no,()=>{const prev=DB.quotes.filter(x=>x.inq===q.no);const no=prev[0]?.no||'QUO-2026-'+String(++DB.counters.q).padStart(4,'0');DB.quotes.push({no,ver:prev.length+1,inq:q.no,qty:g('q-qty'),cur:g('q-cur'),price,basis:g('q-basis'),port:g('q-port'),valid:g('q-valid'),lead:g('q-lead'),terms:g('q-terms'),sample:g('q-sample'),excl:g('q-excl'),status:'Draft',at:now()});if(['New','Assigned'].includes(q.status))q.status='In Discussion'});toast('Quotation draft tersimpan.');render(true)}
 else if(f.id==='cform'){API.admin(UI.role,'content.edit','Konten homepage',()=>{const C=DB.content;C.heroTitle={en:g('c-hen'),id:g('c-hid')};C.heroSub={en:g('c-sen'),id:g('c-sid')};C.featured=g('c-feat');C.heroImg=g('c-hero')});toast('Konten dipublikasikan.');render(true)}
 else if(f.id==='sform'){API.admin(UI.role,'settings','Pengaturan transaksi',()=>{const S=DB.settings;S.reserveMin=Math.max(1,parseInt(g('s-res'))||15);S.notifyOk=g('s-notif')==='1';S.zones.forEach((z,i)=>{z.rate=Math.max(0,parseInt($('#z-r-'+i).value)||0);z.on=$('#z-on-'+i).checked})});toast('Pengaturan tersimpan.');render(true)}
 }catch(err){toast(err.message);render(true)}
});
setInterval(()=>{const el=$('#timer');if(!el)return;const left=Math.max(0,+el.dataset.exp-now());el.textContent=String(Math.floor(left/60000)).padStart(2,'0')+':'+String(Math.floor(left%60000/1000)).padStart(2,'0');if(!left)sweepTick()},1000);

UI.route=location.hash.slice(1)||'home';if(UI.route.startsWith('shop-'))UI.shopCat=UI.route.slice(5);
boot();
